<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="width:1920px;height:1080px;background:var(--bg);color:var(--txt);font-family:Helvetica,Arial,sans-serif;display:flex;flex-direction:column;overflow:hidden;border:1px solid var(--border);position:relative;user-select:none">

  <!-- top menu -->
  <div style="height:40px;flex:none;display:flex;align-items:center;gap:2px;padding:0 10px;background:var(--panel);border-bottom:1px solid var(--border)">
    <div style="display:flex;align-items:center;gap:8px;padding-right:14px;margin-right:6px;border-right:1px solid var(--border)">
      <div style="width:16px;height:16px;border-radius:3px;background:var(--accent)"></div>
      <span style="font-size:13px;font-weight:700;letter-spacing:.14em">REALMWEAVER</span>
    </div>
    <div style="font-size:13px;color:var(--mut);padding:6px 10px;border-radius:5px">Файл</div>
    <div style="font-size:13px;color:var(--mut);padding:6px 10px;border-radius:5px">Правка</div>
    <div style="font-size:13px;color:var(--mut);padding:6px 10px;border-radius:5px">Вид</div>
    <div style="flex:1"></div>
    <span style="font-size:12px;color:var(--mut)">Генерация…</span>
  </div>

  <!-- stage -->
  <div style="flex:1;display:flex;align-items:center;justify-content:center;min-height:0;position:relative;overflow:hidden;background:var(--bg)">
    <div style="position:absolute;inset:0;background-image:radial-gradient(var(--dot) 1px, transparent 1px);background-size:26px 26px;opacity:.7"></div>

    <div style="position:relative;width:560px;background:var(--panel);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);overflow:hidden">
      <!-- header -->
      <div style="padding:28px 36px 22px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:16px">
        <div style="width:44px;height:44px;border-radius:50%;border:4px solid var(--border);border-top-color:var(--accent);border-right-color:var(--accent)"></div>
        <div>
          <div style="font-size:20px;font-weight:700;color:var(--txt)">Создание мира…</div>
          <div style="font-size:13px;color:var(--mut);margin-top:3px;font-family:monospace">azuremoor-4471 · Средний · Материк</div>
        </div>
      </div>

      <!-- progress -->
      <div style="padding:24px 36px 8px">
        <div style="display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px">
          <span style="font-size:14px;color:var(--txt)">Расчёт биомов и климата</span>
          <span style="font-size:15px;font-weight:800;color:var(--accent)">68%</span>
        </div>
        <div style="position:relative;height:8px;background:var(--elev);border-radius:4px;overflow:hidden">
          <div style="position:absolute;left:0;top:0;height:8px;width:68%;background:var(--accent);border-radius:4px"></div>
        </div>
      </div>

      <!-- steps -->
      <div style="padding:22px 36px 8px;display:flex;flex-direction:column;gap:2px">
        <div style="display:flex;align-items:center;gap:12px;padding:8px 0">
          <div style="width:20px;height:20px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;flex:none"><div style="width:9px;height:5px;border-left:2px solid var(--accent-ink);border-bottom:2px solid var(--accent-ink);transform:rotate(-45deg);margin-top:-2px"></div></div>
          <span style="font-size:13px;color:var(--mut)">Генерация высот</span>
        </div>
        <div style="display:flex;align-items:center;gap:12px;padding:8px 0">
          <div style="width:20px;height:20px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;flex:none"><div style="width:9px;height:5px;border-left:2px solid var(--accent-ink);border-bottom:2px solid var(--accent-ink);transform:rotate(-45deg);margin-top:-2px"></div></div>
          <span style="font-size:13px;color:var(--mut)">Океаны и озёра</span>
        </div>
        <div style="display:flex;align-items:center;gap:12px;padding:8px 0">
          <div style="width:20px;height:20px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;flex:none"><div style="width:9px;height:5px;border-left:2px solid var(--accent-ink);border-bottom:2px solid var(--accent-ink);transform:rotate(-45deg);margin-top:-2px"></div></div>
          <span style="font-size:13px;color:var(--mut)">Температура и влажность</span>
        </div>
        <div style="display:flex;align-items:center;gap:12px;padding:8px 0">
          <div style="width:20px;height:20px;border-radius:50%;border:2px solid var(--accent);display:flex;align-items:center;justify-content:center;flex:none"><div style="width:7px;height:7px;border-radius:50%;background:var(--accent)"></div></div>
          <span style="font-size:13px;color:var(--txt);font-weight:600">Расчёт биомов</span>
        </div>
        <div style="display:flex;align-items:center;gap:12px;padding:8px 0">
          <div style="width:20px;height:20px;border-radius:50%;border:2px solid var(--border);flex:none"></div>
          <span style="font-size:13px;color:var(--mut)">Границы регионов</span>
        </div>
        <div style="display:flex;align-items:center;gap:12px;padding:8px 0">
          <div style="width:20px;height:20px;border-radius:50%;border:2px solid var(--border);flex:none"></div>
          <span style="font-size:13px;color:var(--mut)">Расстановка POI-кандидатов</span>
        </div>
      </div>

      <!-- footer -->
      <div style="padding:18px 36px 28px">
        <div style="display:flex;align-items:center;justify-content:center;height:44px;border:1px solid var(--border);background:var(--elev);border-radius:10px;color:var(--txt);font-size:14px;font-weight:600">Отмена</div>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1920,&quot;height&quot;:1080}}"></script>
</body>
</html>
