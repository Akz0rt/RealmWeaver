<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="width:1180px;height:760px;background:var(--bg);color:var(--txt);font-family:Helvetica,Arial,sans-serif;display:flex;flex-direction:column;overflow:hidden;border:1px solid var(--border);position:relative;user-select:none">

  <!-- toolbar strip: tabs + zoom -->
  <div style="height:46px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 12px;background:var(--panel);border-bottom:1px solid var(--border)">
    <div style="display:flex;padding:3px;gap:2px;background:var(--bg);border:1px solid var(--border);border-radius:8px">
      <div style="font-size:13px;font-weight:500;color:var(--mut);padding:6px 16px;border-radius:6px">Карта</div>
      <div style="font-size:13px;font-weight:600;color:var(--accent-ink);background:var(--accent);padding:6px 16px;border-radius:6px">Редактор</div>
      <div style="font-size:13px;font-weight:500;color:var(--mut);padding:6px 16px;border-radius:6px">Точки</div>
    </div>
    <div style="display:flex;align-items:center;gap:6px">
      <div style="width:30px;height:30px;display:flex;align-items:center;justify-content:center;border:1px solid var(--border);border-radius:6px;background:var(--elev);color:var(--mut)">↶</div>
      <div style="width:30px;height:30px;display:flex;align-items:center;justify-content:center;border:1px solid var(--border);border-radius:6px;background:var(--elev);color:var(--mut)">↷</div>
    </div>
  </div>

  <div style="flex:1;position:relative;overflow:hidden;background:var(--map-ocean)">
    <!-- landmass -->
    <div style="position:absolute;top:10%;left:20%;width:64%;height:78%;background:var(--map-land);border-radius:46% 54% 58% 42% / 48% 44% 56% 52%;box-shadow:0 0 0 3px var(--map-coast) inset, var(--shadow)"></div>
    <div style="position:absolute;top:30%;left:44%;width:9%;height:12%;background:var(--map-ocean);border-radius:52% 48% 44% 56% / 48% 52% 48% 52%"></div>

    <!-- brush cursor -->
    <div style="position:absolute;top:44%;left:52%;width:120px;height:120px;border-radius:50%;border:2px dashed var(--accent);background:var(--accent-soft);opacity:.85;transform:translate(-50%,-50%);display:flex;align-items:center;justify-content:center">
      <div style="font-size:26px;font-weight:300;color:var(--accent)">+</div>
    </div>

    <!-- ===== BRUSH PANEL ===== -->
    <div style="position:absolute;top:16px;left:16px;width:264px;background:var(--panel);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);overflow:hidden">
      <div style="display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--border)">
        <span style="font-size:13px;font-weight:700;color:var(--txt)">Кисть</span>
        <span style="font-size:11px;color:var(--accent);font-weight:600">Справка</span>
      </div>

      <div style="padding:14px;display:flex;flex-direction:column;gap:16px">

        <!-- target -->
        <div>
          <div style="font-size:11px;font-weight:600;color:var(--mut);text-transform:uppercase;letter-spacing:.04em;margin-bottom:8px">Что редактируем</div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px">
            <div style="display:flex;align-items:center;gap:7px;font-size:12px;color:var(--accent-ink);background:var(--accent);padding:8px 10px;border-radius:7px;font-weight:600"><div style="width:7px;height:7px;border-radius:50%;background:var(--accent-ink)"></div>Высота</div>
            <div style="display:flex;align-items:center;gap:7px;font-size:12px;color:var(--txt);background:var(--elev);border:1px solid var(--border);padding:8px 10px;border-radius:7px"><div style="width:7px;height:7px;border-radius:50%;background:var(--mut)"></div>Температура</div>
            <div style="display:flex;align-items:center;gap:7px;font-size:12px;color:var(--txt);background:var(--elev);border:1px solid var(--border);padding:8px 10px;border-radius:7px"><div style="width:7px;height:7px;border-radius:50%;background:var(--mut)"></div>Влажность</div>
            <div style="display:flex;align-items:center;gap:7px;font-size:12px;color:var(--txt);background:var(--elev);border:1px solid var(--border);padding:8px 10px;border-radius:7px"><div style="width:7px;height:7px;border-radius:50%;background:var(--mut)"></div>Биом</div>
          </div>
        </div>

        <!-- mode (raise/lower) -->
        <div>
          <div style="font-size:11px;font-weight:600;color:var(--mut);text-transform:uppercase;letter-spacing:.04em;margin-bottom:8px">Режим</div>
          <div style="display:flex;padding:3px;gap:3px;background:var(--bg);border:1px solid var(--border);border-radius:8px">
            <div style="flex:1;text-align:center;font-size:12px;font-weight:600;color:var(--accent-ink);background:var(--accent);padding:7px;border-radius:6px">Поднять</div>
            <div style="flex:1;text-align:center;font-size:12px;color:var(--mut);padding:7px;border-radius:6px">Опустить</div>
            <div style="flex:1;text-align:center;font-size:12px;color:var(--mut);padding:7px;border-radius:6px">Сгладить</div>
          </div>
        </div>

        <!-- shape -->
        <div style="display:flex;align-items:center;justify-content:space-between">
          <span style="font-size:12px;color:var(--txt)">Форма</span>
          <div style="display:flex;gap:6px">
            <div style="width:32px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:7px;background:var(--accent);color:var(--accent-ink)"><div style="width:14px;height:14px;border-radius:50%;border:2px solid currentColor"></div></div>
            <div style="width:32px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:7px;background:var(--elev);border:1px solid var(--border)"><div style="width:13px;height:13px;border:2px solid var(--mut)"></div></div>
          </div>
        </div>

        <!-- size slider -->
        <div>
          <div style="display:flex;justify-content:space-between;margin-bottom:9px"><span style="font-size:12px;color:var(--txt)">Размер</span><span style="font-size:12px;font-weight:700;color:var(--accent)">42 px</span></div>
          <div style="position:relative;height:6px;background:var(--elev);border-radius:3px">
            <div style="position:absolute;left:0;height:6px;width:40%;background:var(--accent);border-radius:3px"></div>
            <div style="position:absolute;left:40%;top:50%;transform:translate(-50%,-50%);width:15px;height:15px;border-radius:50%;background:var(--panel);border:2px solid var(--accent)"></div>
          </div>
        </div>

        <!-- strength slider -->
        <div>
          <div style="display:flex;justify-content:space-between;margin-bottom:9px"><span style="font-size:12px;color:var(--txt)">Сила</span><span style="font-size:12px;font-weight:700;color:var(--accent)">60%</span></div>
          <div style="position:relative;height:6px;background:var(--elev);border-radius:3px">
            <div style="position:absolute;left:0;height:6px;width:60%;background:var(--accent);border-radius:3px"></div>
            <div style="position:absolute;left:60%;top:50%;transform:translate(-50%,-50%);width:15px;height:15px;border-radius:50%;background:var(--panel);border:2px solid var(--accent)"></div>
          </div>
        </div>
      </div>

      <div style="padding:12px 14px;border-top:1px solid var(--border);display:flex;gap:8px">
        <div style="flex:1;text-align:center;font-size:12px;color:var(--txt);background:var(--elev);border:1px solid var(--border);padding:9px;border-radius:7px">Отменить всё</div>
      </div>
    </div>

    <!-- biome palette (contextual, shows for Биом target) -->
    <div style="position:absolute;bottom:16px;left:16px;width:264px;background:var(--panel);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);overflow:hidden">
      <div style="padding:11px 14px;border-bottom:1px solid var(--border);font-size:11px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.04em">Палитра биома · для кисти «Биом»</div>
      <div style="padding:12px 14px;display:grid;grid-template-columns:repeat(6,1fr);gap:8px">
        <div style="aspect-ratio:1;border-radius:6px;background:#4f8f5a;box-shadow:0 0 0 2px var(--accent)"></div>
        <div style="aspect-ratio:1;border-radius:6px;background:#8aa356"></div>
        <div style="aspect-ratio:1;border-radius:6px;background:#d8c98a"></div>
        <div style="aspect-ratio:1;border-radius:6px;background:#e8e8ee"></div>
        <div style="aspect-ratio:1;border-radius:6px;background:#6b8f7a"></div>
        <div style="aspect-ratio:1;border-radius:6px;background:#b7a06a"></div>
        <div style="aspect-ratio:1;border-radius:6px;background:#3d6b4a"></div>
        <div style="aspect-ratio:1;border-radius:6px;background:#c98a5a"></div>
        <div style="aspect-ratio:1;border-radius:6px;background:#9aa0a6"></div>
        <div style="aspect-ratio:1;border-radius:6px;background:#7a9ab0"></div>
        <div style="aspect-ratio:1;border-radius:6px;background:#d5b96a"></div>
        <div style="aspect-ratio:1;border-radius:6px;background:#5a7d8f"></div>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1180,&quot;height&quot;:760}}"></script>
</body>
</html>
